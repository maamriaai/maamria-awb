name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # The package's only declared script is `build` (tsc). It also acts
      # as our type-check — `tsc` fails on type errors without emitting.
      - name: Type-check & build
        run: npm run build

      - name: Smoke-test the bin entry
        shell: bash
        run: |
          node bin/maamria-awb.js --version
          node bin/maamria-awb.js --help
